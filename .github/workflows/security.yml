# Dependency vulnerability scanning. Both jobs are BLOCKING: a new advisory in a
# Python or npm dependency fails CI. Known, currently-unfixable transitive/tooling
# advisories are suppressed by explicit id below (never a blanket ignore); each is
# tracked by Dependabot and documented in doc/ci.md with an expiry/review owner.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "29 20 * * 3"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pip-audit (pinned)
        run: pip install pip-audit==2.10.1
      # Audit the locked project dependencies (constraints.txt) — not the full
      # runner environment — so the result is deterministic.
      # Suppressions (review by 2026-10-01): transitive via fastapi/starlette and
      # dev/build tooling (pytest, setuptools) with no in-range fix; Dependabot
      # tracks the upgrades. Any advisory NOT listed here fails the build.
      - name: Audit Python dependencies (blocking)
        run: |
          pip-audit -r constraints.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-3447

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Mirrors the pip-audit step above: a small, reviewed, dated allowlist,
      # and ANY high/critical advisory not on it fails the build. `npm audit`
      # has no --ignore flag, so the JSON is filtered here instead.
      #
      # Suppressions (review by 2026-10-01):
      #   GHSA-qwww-vcr4-c8h2  react-router "RSC Mode CSRF Bypass".
      #     Affects 7.12.0-8.2.0. There is no forward fix: react-router-dom's
      #     latest published release is 7.18.2, still inside that range, and
      #     npm's suggested remedy downgrades to 7.11.0 (breaking). The
      #     advisory is specific to React Server Components mode; this app is a
      #     client-rendered SPA (main.tsx mounts BrowserRouter, there is no RSC
      #     and no server-side router), so the vulnerable path is not reachable.
      #     Dependabot tracks the upgrade.
      - name: Audit npm dependencies (blocking on high+)
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          ALLOWED = {"GHSA-qwww-vcr4-c8h2"}

          report = subprocess.run(
              ["npm", "audit", "--audit-level=high", "--json"],
              capture_output=True, text=True,
          ).stdout
          advisories = json.loads(report).get("vulnerabilities", {})

          unreviewed = []
          for name, entry in advisories.items():
              if entry.get("severity") not in ("high", "critical"):
                  continue
              for via in entry.get("via", []):
                  if not isinstance(via, dict):
                      continue
                  ident = via.get("url", "").rsplit("/", 1)[-1]
                  if ident not in ALLOWED:
                      unreviewed.append(f"{ident}  {entry['severity']:<8} {name}")

          if unreviewed:
              print("Unreviewed high/critical advisories:", file=sys.stderr)
              for line in sorted(set(unreviewed)):
                  print(f"  {line}", file=sys.stderr)
              print(
                  "\nFix them, or add the advisory id to ALLOWED in this step "
                  "with a justification and a review date.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(f"No unreviewed high/critical advisories ({len(ALLOWED)} suppressed).")
          PY
